# CI for Ori Travel AI (ori-travel-ai/). Independent from the other projects' workflows.
name: Ori Travel AI

on:
  push:
    paths:
      - "ori-travel-ai/**"
      - ".github/workflows/ori-travel-ai.yml"
  pull_request:
    paths:
      - "ori-travel-ai/**"
      - ".github/workflows/ori-travel-ai.yml"

permissions:
  contents: read

concurrency:
  group: ori-travel-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api · ruff · pytest · migrate (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ori-travel-ai/apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ori-travel-ai/apps/api/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Migrate a fresh SQLite database
        env:
          ORI_DATABASE_URL: sqlite:///${{ runner.temp }}/ori-ci.db
        run: python -m app.cli migrate
      - name: Migrations match the models (alembic check)
        env:
          ORI_DATABASE_URL: sqlite:///${{ runner.temp }}/ori-ci.db
        run: python -m alembic check
      - name: Backup / restore helper on the throwaway database
        env:
          ORI_DATABASE_URL: sqlite:///${{ runner.temp }}/ori-ci.db
        run: |
          python ../../scripts/_backup_db.py --if-pending-migrations --label pre-migrate
          python ../../scripts/_backup_db.py
          python ../../scripts/_backup_db.py --restore "$(ls data/backups/ori-ci-2*.db | head -1)"
      - name: Shellcheck (scripts)
        working-directory: ori-travel-ai/scripts
        run: shellcheck -x -S warning *.sh

  api-postgres:
    name: api · migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ori-travel-ai/apps/api
    services:
      postgres:
        image: postgres:16
        env:
          # Test-only credentials; no real secrets are used in CI.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ori_travel_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ORI_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ori_travel_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ori-travel-ai/apps/api/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install "psycopg[binary]"
      - name: Migrate (upgrade head)
        run: python -m app.cli migrate
      - name: Round trip (downgrade base, upgrade head)
        run: |
          python -m alembic downgrade base
          python -m app.cli migrate

  web:
    name: web · typecheck · lint · vitest · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ori-travel-ai/apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ori-travel-ai/apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e · playwright (API serves the built web app)
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      E2E_PORT: "8765"
      # Throwaway values for CI only; the DB lives in the runner's temp dir.
      ORI_DATABASE_URL: sqlite:///${{ runner.temp }}/ori-e2e.db
      ORI_ENV: development
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ori-travel-ai/apps/api/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ori-travel-ai/apps/web/package-lock.json
      - name: Install API dependencies
        working-directory: ori-travel-ai/apps/api
        run: pip install -r requirements.txt
      - name: Install web dependencies and build
        working-directory: ori-travel-ai/apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare database and owner
        working-directory: ori-travel-ai/apps/api
        env:
          ORI_OWNER_PASSWORD: Ci-E2E-Passphrase-2026-xyz
        run: |
          python -m app.cli migrate
          python -m app.cli create-owner --email owner@e2e.test --name "E2E Owner" --password-env ORI_OWNER_PASSWORD
      - name: Start API (serves apps/web/dist)
        working-directory: ori-travel-ai/apps/api
        run: |
          ORI_DATA_KEY="$(python -m app.cli gen-key)" nohup python -m uvicorn app.main:app --no-proxy-headers --host 127.0.0.1 --port "$E2E_PORT" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$E2E_PORT/api/health" > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Install Playwright browser
        working-directory: ori-travel-ai/apps/web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: ori-travel-ai/apps/web
        env:
          E2E_BASE_URL: http://127.0.0.1:8765
          E2E_OWNER_EMAIL: owner@e2e.test
          E2E_OWNER_PASSWORD: Ci-E2E-Passphrase-2026-xyz
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ori-travel-ai/apps/web/playwright-report
            ori-travel-ai/apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: API log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  security:
    name: security · pip-audit · bandit · npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ori-travel-ai/apps/api/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit tools
        run: pip install -r ori-travel-ai/apps/api/requirements-dev.txt
      - name: pip-audit (runtime dependencies)
        run: pip-audit -r ori-travel-ai/apps/api/requirements.txt
      - name: bandit (medium+ severity)
        working-directory: ori-travel-ai/apps/api
        run: bandit -r app -ll -q
      - name: npm audit (production dependencies, high+)
        working-directory: ori-travel-ai/apps/web
        run: npm audit --omit=dev --audit-level=high
