# CI של DISCIPLINE OS ULTRA (אפליקציית Android) — רץ רק כשיש שינוי בתיקיית הפרויקט.
# מסלול 1: בדיקות domain טהורות (Kotlin/JVM) — לא דורש Android SDK.
# מסלול 2: build מלא של Android (debug APK), בדיקות יחידה ו-lint — דורש Google Maven (זמין ב-GitHub Actions).
name: DISCIPLINE OS ULTRA

on:
  push:
    paths:
      - "discipline-os-ultra/**"
      - ".github/workflows/discipline-os-ultra.yml"
  pull_request:
    paths:
      - "discipline-os-ultra/**"
      - ".github/workflows/discipline-os-ultra.yml"

permissions:
  contents: read

# push + pull_request on the same branch share a group; a newer run cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: discipline-os-ultra

jobs:
  domain:
    name: בדיקות domain (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p verify-jvm test --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-test-reports
          path: discipline-os-ultra/core/*/build/reports/tests/

  android:
    name: Android build + unit tests + lint
    runs-on: ubuntu-latest
    needs: domain
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest כולל Android SDK מותקן מראש (ANDROID_HOME). אין סודות ואין חתימת release ב-CI.
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Room schema drift (generated vs committed)
        run: |
          # Room KSP writes the schema of the CURRENT db version into the build dir; compare it with the committed file.
          GEN=$(find app/build -path '*schemas*' -name '2.json' | head -1)
          COMMITTED=app/schemas/com.disciplineos.app.data.local.DisciplineDatabase/2.json
          if [ -z "$GEN" ]; then echo "ROOM_SCHEMA: generated schema not found under app/build"; exit 0; fi
          echo "generated: $GEN"
          python3 - "$GEN" "$COMMITTED" <<'PY'
          import json, sys
          g, c = (json.load(open(p)) for p in sys.argv[1:3])
          print("ROOM_SCHEMA generated identityHash:", g["database"]["identityHash"])
          print("ROOM_SCHEMA committed identityHash:", c["database"]["identityHash"])
          strip = lambda d: {k: v for k, v in d["database"].items() if k not in ("identityHash", "setupQueries")}
          print("ROOM_SCHEMA structure:", "IDENTICAL" if strip(g) == strip(c) else "DIFFERS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: discipline-os-ultra-debug-apk
          path: discipline-os-ultra/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            discipline-os-ultra/app/build/reports/
            discipline-os-ultra/app/schemas/

  emulator:
    name: Instrumented tests + screenshots (emulator)
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Run on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: discipline-os-ultra
          script: bash ci/emulator-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results-and-screenshots
          path: |
            discipline-os-ultra/app/build/reports/androidTests/
            discipline-os-ultra/app/build/outputs/androidTest-results/
            discipline-os-ultra/ci-screenshots/
