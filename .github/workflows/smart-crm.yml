# CI for SMART CRM AI (smart-crm/). Independent from the Kerem Orders workflow.
name: SMART CRM AI

on:
  push:
    paths:
      - "smart-crm/**"
      - ".github/workflows/smart-crm.yml"
  pull_request:
    paths:
      - "smart-crm/**"
      - ".github/workflows/smart-crm.yml"

permissions:
  contents: read

concurrency:
  group: smart-crm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · unit · integration · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: smart-crm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      CI: "1"
      # Test-only values; no real secrets are used in CI.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/smart_crm_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/smart_crm_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: smart-crm/package-lock.json

      - run: npm ci

      - name: Generated files are up to date (i18n index)
        run: |
          npm run i18n:index
          git diff --exit-code -- src/i18n/messages.generated.ts

      - name: Generated files are up to date (Supabase migration bundle)
        run: |
          npm run db:bundle
          git diff --exit-code -- supabase/deploy/all-migrations.sql

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration

      - name: Schema drift (migrations ↔ generated Drizzle schema)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/smart_crm_drift
        run: |
          npx tsx scripts/db.ts reset
          npm run db:check

      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: smart-crm/playwright-report
          retention-days: 7
