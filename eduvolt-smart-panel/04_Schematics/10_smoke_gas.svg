<text x="1055" y="953" font-size="12" text-anchor="start" direction="rtl" unicode-bidi="embed" font-weight="bold">הערות</text>
<text x="22" y="975" font-size="11.5" text-anchor="start">B5: check 24V operation, current draw and whether it latches until power-off (BOM).</text>
<text x="1055" y="975" font-size="11.5" text-anchor="start" direction="rtl" unicode-bidi="embed">לבדוק אם הגלאי ננעל</text>
<text x="22" y="995" font-size="11.5" text-anchor="start">IB and IC are analog-capable inputs used here as digital inputs (IO_MAP).</text>
<text x="22" y="1015" font-size="11.5" text-anchor="start">G2 / X3 5V is NOT isolated: X3 0V5 is common with X2 0V (sheet 06).</text>
<text x="1055" y="1015" font-size="11.5" text-anchor="start" direction="rtl" unicode-bidi="embed">הממיר לא מבודד</text>
<text x="22" y="1035" font-size="11.5" text-anchor="start">B5 and KA2 contact terminal names are TBD / to verify on the real devices.</text>
<text x="22" y="1055" font-size="11.5" text-anchor="start">Dotted = CONDITIONAL (KA1). Final location of B6 depends on gas type (TBD).</text>
<text x="22" y="1075" font-size="11.5" text-anchor="start">Wire colours illustrative — see WIRE_COLORS.md</text>
<text x="1055" y="1075" font-size="11.5" text-anchor="start" direction="rtl" unicode-bidi="embed">צבעי המוליכים להמחשה בלבד — ראו WIRE_COLORS.md</text>
