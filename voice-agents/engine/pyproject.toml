[project]
name = "voice-agents-engine"
version = "0.1.0"
description = "Real-time Hebrew phone agents: Twilio + ElevenLabs + Claude, with tools that act"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[anthropic,elevenlabs,silero,websocket]==1.14.0",
    "anthropic==1.17.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "loguru==0.7.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "twilio==9.12.0", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# FastAPI dependencies are declared as Depends(...) defaults by design.
ignore = ["B008"]
